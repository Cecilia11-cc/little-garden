<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小花园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c9d8b8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    background: #faf6ef; color: #5a4a3a; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 1s ease;
  }
  body.weather-rainy { background: #e8eef2; }
  body.weather-hot { background: #f5e8d8; }
  body.weather-windy { background: #e8eef0; }
  body.weather-cloudy { background: #eef0ee; }
  body.weather-frost { background: #e4edf3; }
  body.weather-hail { background: #e0e8ee; }
  body.weather-storm { background: #dde4ea; }

  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; height: 300px;
    background: radial-gradient(ellipse at 50% 0%, rgba(243,230,207,0.6) 0%, transparent 70%);
    pointer-events: none;
  }
  .wrap {
    position: relative; max-width: 720px; margin: 0 auto;
    padding: 28px 20px 50px;
  }

  header { text-align: center; margin-bottom: 14px; }
  header h1 {
    font-family: "Noto Serif SC", serif;
    font-size: 24px; font-weight: 500; color: #4a3d30; letter-spacing: 2px;
  }
  header .sub { font-size: 12px; color: #a08c72; margin-top: 6px; letter-spacing: 2px; }

  .env {
    display: flex; justify-content: center; gap: 10px; margin: 14px 0 18px;
    flex-wrap: wrap;
  }
  .env-chip {
    background: rgba(255,255,255,0.7);
    border: 1px solid #e8dcc8;
    border-radius: 16px;
    padding: 7px 14px;
    font-size: 12.5px;
    color: #6b5540;
    display: flex; align-items: center; gap: 6px;
  }
  .env-chip b { color: #8a6f4e; font-weight: 500; }

  .garden {
    background: linear-gradient(180deg, #f5efe2 0%, #e8f0dc 100%);
    border-radius: 24px;
    padding: 20px;
    border: 1px solid #e5d9bf;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    min-height: 420px;
  }

  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fx span { position: absolute; display: block; }
  .fx.rain span {
    width: 1.5px; height: 14px;
    background: rgba(127,168,212,0.5);
    border-radius: 1px;
    animation: fall 0.9s linear infinite;
  }
  .fx.storm span {
    width: 2px; height: 22px;
    background: rgba(100,130,170,0.6);
    animation: fall 0.5s linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-20px); opacity: 0; }
    30% { opacity: 1; }
    to { transform: translateY(380px); opacity: 0; }
  }
  .fx.snow span {
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    from { transform: translateY(-20px) translateX(0); opacity: 0; }
    20% { opacity: 0.9; }
    to { transform: translateY(400px) translateX(30px); opacity: 0.3; }
  }
  .fx.hail span {
    width: 5px; height: 5px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 2px rgba(150,180,210,0.6);
    animation: hailfall 0.6s linear infinite;
  }
  @keyframes hailfall {
    from { transform: translateY(-20px); opacity: 0; }
    30% { opacity: 1; }
    to { transform: translateY(380px); opacity: 0.4; }
  }

  .plant-name {
    font-family: "Noto Serif SC", serif;
    font-size: 19px; color: #6b5540;
    position: relative; z-index: 2;
  }

  .pot-wrap {
    height: 240px;
    display: flex; align-items: flex-end; justify-content: center;
    position: relative; z-index: 2;
  }
  .pot-wrap svg { height: 230px; transition: transform 0.5s ease, filter 0.8s ease; }
  @keyframes sway {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-2.5deg); }
    75% { transform: rotate(2.5deg); }
  }
  .pot-wrap.sway svg { animation: sway 0.9s ease; transform-origin: bottom center; }
  .pot-wrap.thirsty svg { transform: rotate(4deg); filter: sepia(0.15); }
  .pot-wrap.droopy svg { transform: rotate(-4deg) scaleY(0.94); filter: brightness(0.95); }
  .pot-wrap.soil-ok svg { filter: saturate(0.85); }
  .pot-wrap.soil-bad svg { filter: saturate(0.5) sepia(0.2); transform: scaleY(0.96); }
  .pot-wrap.frost svg { filter: hue-rotate(180deg) saturate(0.8) brightness(1.1); }
  .pot-wrap.hurt svg { transform: rotate(6deg); filter: sepia(0.3) brightness(0.9); }
  .pot-wrap.bloom svg { filter: drop-shadow(0 0 8px rgba(240,200,180,0.5)); }
  .pot-wrap.wilt svg { filter: sepia(0.5) saturate(0.6) brightness(0.9); transform: rotate(8deg) scaleY(0.9); }
  .pot-wrap.dead svg { filter: grayscale(1) sepia(0.6) brightness(0.7); transform: scaleY(0.85); opacity: 0.7; }
  /* 持续呼吸：舒适时轻快，不舒适时迟缓 */
  @keyframes breathe {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(1.2deg); }
  }
  .pot-wrap.breathe svg { animation: breathe 5.5s ease-in-out infinite; transform-origin: bottom center; }
  .pot-wrap.breathe.bad svg { animation-duration: 9s; animation-timing-function: ease-in-out; }
  .pot-wrap.breathe.windy svg { animation-duration: 2.5s; animation-name: breathe-fast; }
  .pot-wrap.breathe.cloudy svg { animation-duration: 8s; }
  @keyframes breathe-fast {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
  }
  /* 天气延后显示：veiled 时天气 chip 透明 */
  .env-box[data-veiled="1"] .env-chip:last-child { opacity: 0; transition: opacity 1.2s; }
  .env-box[data-veiled="0"] .env-chip:last-child { opacity: 1; transition: opacity 1.2s; }
  /* 浇水冷却 */
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .pest-dots { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .pest-dots span {
    position: absolute; width: 5px; height: 5px;
    background: #d46060; border-radius: 50%;
    opacity: 0.8;
  }

  .actions {
    margin-top: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    position: relative; z-index: 2;
  }
  .btn {
    border: none; padding: 11px 24px; border-radius: 22px;
    font-size: 13.5px; cursor: pointer; font-family: inherit;
    letter-spacing: 2px; transition: all 0.25s ease;
  }
  .btn-water {
    background: #7fa8d4; color: #fff;
    box-shadow: 0 4px 12px rgba(100,140,190,0.3);
  }
  .btn-water:hover { background: #6b95c2; transform: translateY(-1px); }
  .btn-water:active { transform: scale(0.95); }
  .btn-seed {
    background: #8aa876; color: #fff;
    box-shadow: 0 4px 12px rgba(120,150,100,0.3);
  }
  .btn-seed:hover { background: #7a9a66; transform: translateY(-1px); }
  .btn-reset {
    background: transparent; color: #a08c72;
    border: 1px solid #d4c4a8;
  }

  .whisper {
    text-align: center;
    font-family: "Noto Serif SC", serif;
    font-size: 14px; color: #7a6848;
    min-height: 24px; margin-top: 14px; font-style: italic;
    opacity: 0; transition: opacity 0.6s ease;
    position: relative; z-index: 2;
  }
  .whisper.show { opacity: 1; }

  footer {
    text-align: center; margin-top: 20px;
    font-size: 11px; color: #b0a080; letter-spacing: 2px;
  }

  /* ===== 首页 ===== */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(135deg, #faf6ef 0%, #e8f0dc 50%, #f3ecdc 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1s ease, transform 1s ease;
    overflow: hidden;
  }
  #splash .blob {
    position: absolute; border-radius: 50%; filter: blur(80px);
  }
  #splash .blob-green {
    width: 380px; height: 380px; background: rgba(180,210,160,0.5);
    top: -80px; right: -80px;
  }
  #splash .blob-cream {
    width: 320px; height: 320px; background: rgba(245,225,190,0.5);
    bottom: -60px; left: -60px;
  }
  #splash.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }

  .splash-inner {
    position: relative; z-index: 2;
    text-align: center;
    max-width: 400px; padding: 20px;
  }
  .splash-item {
    opacity: 0; transform: translateY(15px) scale(0.98);
    transition: opacity 1.5s ease, transform 1.5s ease;
  }
  .splash-item.in { opacity: 1; transform: translateY(0) scale(1); }

  .leaf-icon {
    width: 76px; height: 76px; margin: 0 auto 20px;
  }
  .splash-title {
    font-family: "Noto Serif SC", serif;
    font-size: 30px; color: #4a5a48;
    letter-spacing: 6px; margin-bottom: 10px;
  }
  .splash-sub {
    font-size: 12px; color: #8aa08a; letter-spacing: 8px;
    margin-bottom: 18px;
  }
  .splash-line {
    width: 42px; height: 1px; background: #a8bfa0;
    margin: 0 auto 28px;
  }
  .splash-buttons {
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; margin-bottom: 40px;
  }
  .btn-start {
    background: #8aa876; color: #fff;
    border: none; padding: 13px 44px; border-radius: 26px;
    font-size: 14px; letter-spacing: 6px; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 18px rgba(138,168,118,0.35);
    transition: all 0.3s ease;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(138,168,118,0.45); }
  .btn-start:active { transform: scale(0.97); }
  .btn-tips {
    background: transparent; color: #8aa08a;
    border: 1px solid #a8bfa0; padding: 10px 32px; border-radius: 22px;
    font-size: 13px; letter-spacing: 4px; cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
  }
  .btn-tips:hover { background: rgba(168,191,160,0.12); border-color: #8aa08a; }
  .btn-tips:active { transform: scale(0.97); }

  .splash-contact {
    position: absolute; bottom: 24px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #b0b8a8;
    letter-spacing: 1px;
  }
  .splash-contact b { color: #8a9a80; font-weight: 500; }

  /* ===== Tips 弹层 ===== */
  #tipsModal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(60,70,60,0.45);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.85s ease;
  }
  #tipsModal.show { opacity: 1; pointer-events: auto; }
  .tips-card {
    background: #fdfaf3;
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 360px; width: 90%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 16px 48px rgba(60,70,60,0.2);
    transform: translateY(20px);
    transition: transform 0.85s ease;
  }
  #tipsModal.show .tips-card { transform: translateY(0); }
  .tips-card h2 {
    font-family: "Noto Serif SC", serif;
    font-size: 18px; color: #4a5a48;
    letter-spacing: 4px; margin-bottom: 20px;
    text-align: center; font-weight: 500;
  }
  .tips-card ul { list-style: none; }
  .tips-card li {
    position: relative; padding-left: 16px;
    font-size: 13.5px; line-height: 1.9; color: #6a6a5a;
    margin-bottom: 12px;
  }
  .tips-card li::before {
    content: ''; position: absolute; left: 0; top: 10px;
    width: 5px; height: 5px; border-radius: 50%;
    background: #a8bfa0;
  }
  .tips-card li b { color: #4a5a48; font-weight: 500; }
  .btn-got {
    width: 100%; margin-top: 16px;
    background: #c9d4c0; color: #4a5a48;
    border: none; padding: 11px; border-radius: 12px;
    font-size: 13px; letter-spacing: 4px; cursor: pointer;
    font-family: inherit;
    transition: background 0.25s ease;
  }
  .btn-got:hover { background: #b8c8b0; }

  /* ===== 结算弹窗 ===== */
  #endModal {
    position: fixed; inset: 0; z-index: 150;
    background: rgba(60,70,60,0.4);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease;
    padding: 20px;
  }
  #endModal.show { opacity: 1; pointer-events: auto; }
  .end-card {
    background: #fdfaf3;
    border-radius: 20px;
    padding: 40px 36px;
    max-width: 440px; width: 100%;
    max-height: 85vh; overflow-y: auto;
    box-shadow: 0 16px 48px rgba(60,70,60,0.2);
    transform: translateY(20px);
    transition: transform 0.8s ease;
    font-family: "Noto Serif SC", serif;
    text-wrap: pretty;
    word-break: keep-all;
    line-break: strict;
  }
  #endModal.show .end-card { transform: translateY(0); }
  .end-title {
    font-size: 19px; color: #4a5a48;
    text-align: center; line-height: 1.8;
    margin-bottom: 1.4em; font-weight: 500;
    letter-spacing: 1px;
  }
  .end-quote {
    font-size: 13.5px; color: #7a6e58;
    line-height: 2.1; font-style: italic;
    padding: 14px 18px;
    margin: 1.8em 12px;
    border-left: 3px solid #9eb090;
    background: rgba(168,180,150,0.12);
    white-space: pre-line;
    text-align: left;
  }
  .end-body {
    font-size: 14.5px; color: #5a5040;
    line-height: 2.1;
    margin: 0 4px;
    text-align: left;
  }
  .end-end {
    font-size: 13.5px; color: #8a7a60;
    text-align: center;
    margin: 2em 0 0.6em;
    letter-spacing: 1px;
    line-height: 1.9;
  }
  .end-actions {
    margin-top: 2.2em; display: flex; justify-content: center; gap: 10px;
  }

  @media (max-width: 500px) {
    .pot-wrap { height: 200px; }
    .pot-wrap svg { height: 190px; }
    .garden { min-height: 380px; }
  }
</style>
</head>

<!-- ===== Tips 弹层 ===== -->
<div id="tipsModal">
  <div class="tips-card">
    <h2>小 Tips</h2>
    <ul>
      <li>这盆花<b>没有进度条</b>。全靠你看叶子的姿态、颜色，和土的深浅。</li>
      <li>土发白了、叶子软了，再浇水。一次浇 <b>22 点</b>。</li>
      <li>雨天不用浇，它自己会接。<b>大风和高温</b>要盯紧些，水跑得快。</li>
      <li>每种植物都有自己的<b>舒适水分区间</b>，多养几局就熟了。</li>
      <li>土壤也挑人。<b>仙人掌、多肉</b>喜欢沙质土，<b>兰花、鸢尾</b>偏爱腐殖土。</li>
      <li>养死了不要紧。换一颗种子，就是新的一局。</li>
    </ul>
    <button class="btn-got" id="gotBtn">知道啦</button>
  </div>
</div>

<!-- ===== 结算弹窗 ===== -->
<div id="endModal">
  <div class="end-card">
    <div class="end-title" id="endTitle"></div>
    <div class="end-quote" id="endQuote" style="display:none"></div>
    <div class="end-body" id="endBody"></div>
    <div class="end-end" id="endEnd"></div>
    <div class="end-actions">
      <button class="btn btn-seed" id="endAgainBtn">换一颗种子</button>
    </div>
  </div>
</div>

<!-- ===== 游戏主体 ===== -->

  // ===== 状态 =====
  let current, soilKey, weatherKey;
  function freshState() {
    return {
      water: 50, growth: 0, hurt: false,
      wilted: false, dead: false,
      bloomSeconds: 0,
      stressDry: 0, stressWet: 0, stressFrozen: 0, stressPest: 0, stressHurt: 0,
      deathCause: null
    };
  }
  let state = freshState();
  let gameStarted = false;
  let timer = null;

  const potWrap = document.getElementById('potWrap');
  const pname = document.getElementById('pname');
  const envBox = document.getElementById('env');
  const fxBox = document.getElementById('fx');
  const pestDots = document.getElementById('pestDots');
  const whisper = document.getElementById('whisper');

  const endModal = document.getElementById('endModal');
  const endTitle = document.getElementById('endTitle');
  const endQuote = document.getElementById('endQuote');
  const endBody = document.getElementById('endBody');
  const endEnd = document.getElementById('endEnd');

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function soilMatch() {
    const p = plants[current];
    if (p.soils.includes(soilKey)) return 'good';
    if (p.soils.length === 4) return 'ok';
    if (soilKey === 'clay' && p.comfort[1] <= 55) return 'bad';
    return 'ok';
  }

  function buildFx() {
    const w = weathers[weatherKey];
    fxBox.innerHTML = '';
    pestDots.style.display = 'none';
    let count = 0, cls = '';
    if (w.rain) { count = w.rain; cls = 'rain'; }
    else if (w.snow) { count = w.snow; cls = 'snow'; }
    else if (w.hail) { count = w.hail; cls = 'hail'; }
    else if (w.storm) { count = w.storm; cls = 'storm'; }
    else if (w.pest) {
      pestDots.style.display = 'block';
      for (let i = 0; i < 4; i++) {
        const d = document.createElement('span');
        d.style.left = (38 + Math.random() * 24) + '%';
        d.style.top = (35 + Math.random() * 35) + '%';
        pestDots.appendChild(d);
      }
    }
    if (cls) {
      fxBox.className = 'fx ' + cls;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 1.5) + 's';
        s.style.animationDuration = (0.5 + Math.random() * 0.8) + 's';
        fxBox.appendChild(s);
      }
    }
  }

  function pickWeightedWeather() {
    const wKeys = Object.keys(weathers);
    const weights = { sunny:3, cloudy:3, lightrain:2, windy:1.5, hot:1.5, frozen:1, hail:0.4, storm:0.8, pest:0.4, hurt:0.4 };
    let total = 0; wKeys.forEach(k => total += (weights[k]||1));
    let r = Math.random()*total, picked = wKeys[0];
    for (const k of wKeys) { r -= (weights[k]||1); if (r<=0) { picked=k; break; } }
    return picked;
  }
  let gamesPlayed = parseInt(localStorage.getItem('gardenRounds') || '0', 10);
  let form = { s:1, r:0, b:1 };
  function newRound() {
    gamesPlayed++;
    localStorage.setItem('gardenRounds', gamesPlayed);
    const st = document.querySelector('.splash-title');
    if (st) st.textContent = gamesPlayed >= 3 ? '我的小花园。' : '我的小花园';
    current = rand(Object.keys(plants));
    soilKey = rand(Object.keys(soils));
    weatherKey = pickWeightedWeather();
    state = freshState();
    document.body.className = 'weather-' + weatherKey;
    buildFx();
    endModal.classList.remove('show');
    render();
    if (envBox) envBox.dataset.veiled = '1';
    setTimeout(() => { if (envBox) envBox.dataset.veiled = '0'; }, 3000);
    form = {
      s: 0.92 + Math.random()*0.16,
      r: (Math.random()*6 - 3),
      b: 0.94 + Math.random()*0.12
    };
  }

  function render() {
    const p = plants[current];
    const w = weathers[weatherKey];
    const s = soils[soilKey];
    const m = soilMatch();

    pname.textContent = p.name;
    envBox.innerHTML = `
      <div class="env-chip">植物 <b>${p.name}</b></div>
      <div class="env-chip">土壤 <b>${s.name}</b></div>
      <div class="env-chip">${w.ico} <b>${w.name}</b></div>
    `;

    let body;
    if (state.dead) body = p.mature;
    else if (state.wilted) body = p.mature;
    else if (state.growth < 10) body = seedStage;
    else if (state.growth < 30) body = sprout;
    else if (state.growth < 100) body = p.mature;
    else body = p.bloom;
    potWrap.innerHTML = `<svg viewBox="0 0 200 210"><g transform="translate(100,0) scale(${form.s}) translate(-100,0) rotate(${form.r} 100 180)" style="filter:brightness(${form.b})">${pot}${body}</g></svg>`;

    potWrap.classList.remove('thirsty','droopy','soil-ok','soil-bad','frost','hurt','bloom','sway','wilt','dead');
    potWrap.classList.remove('thirsty','droopy','soil-ok','soil-bad','frost','hurt','bloom','sway','wilt','dead','breathe','bad','windy','cloudy');
    const [lo, hi] = p.comfort;
    if (state.dead) potWrap.classList.add('dead');
    else if (state.wilted) potWrap.classList.add('wilt');
    else {
      potWrap.classList.add('breathe');
      const inComfort = state.water >= lo && state.water <= hi;
      if (!inComfort) potWrap.classList.add('bad');
      if (weatherKey==='windy') potWrap.classList.add('windy');
      if (weatherKey==='cloudy') potWrap.classList.add('cloudy');
      if (state.water < lo * 0.6) potWrap.classList.add('thirsty');
      if (state.water > hi + 15) potWrap.classList.add('droopy');
      if (m === 'ok') potWrap.classList.add('soil-ok');
      if (m === 'bad') potWrap.classList.add('soil-bad');
      if (w.frozen) potWrap.classList.add('frost');
      if (state.hurt || w.hurt) potWrap.classList.add('hurt');
      if (state.growth >= 100 && !state.wilted) potWrap.classList.add('bloom');
    }
  }

  const whispers = {
    thirsty: ['它有点蔫。', '叶子垂下来了。'],
    flooded: ['它好像喝多了。', '土还湿着。'],
    watered: ['水落进土里。', '它喝了一口。', '你不知道它够不够。', '多一点，还是少一点？', '你做了你能做的。', '叶片轻轻晃了一下。'],
    bloomed: ['它开了。', '它开了。你不知道它什么时候决定的。'],
    cold: ['它缩着。', '外面太冷了。'],
    ok: ['刚刚好。', '它舒展着。'],
    seed: ['它把土顶开了一条缝。'],
    sprout: ['它先伸了一片叶子出来，试探。'],
    mature: ['它开始攒力气了。'],
    rain: ['它在接雨。你不需要做什么。'],
    idle: ['你什么都没做。它也没说什么。'],
    newSeed: ['换一颗。不是重来，是重新开始。', '上一株留在上一局了。', '土还是这块土。'],
    move: ['换了个位置。', '天气不归你管。位置可以。', '你把它抱到了另一个地方。']
  };
  function say(type) {
    whisper.textContent = '“' + whispers[type][Math.floor(Math.random() * whispers[type].length)] + '”';
    whisper.classList.remove('show');
    void whisper.offsetWidth;
    whisper.classList.add('show');
  }

  // ===== 结算弹窗（改造：优先 deathStories） =====
  function showEnd(cause) {
    state.deathCause = cause;
    const p = plants[current];
    const s = soils[soilKey];
    const w = weathers[weatherKey];

    let title, quote, bodyText, endText;
    let pool;
    if (compoundStories[cause]) pool = compoundStories[cause];
    else if (deathStories[current] && deathStories[current][cause]) pool = deathStories[current][cause];
    else pool = [{ title: '这一局，结束了。', quote: '', body: () => '', end: '换一颗种子吧。' }];
    const story = pool[Math.floor(Math.random() * pool.length)];
    title = story.title;
    quote = story.quote || '';
    bodyText = story.body(p, s, w);
    endText = story.end;

    endTitle.textContent = title;
    if (quote) {
      // 把诗句里的 / 换成真正的换行，保留原诗分行
      endQuote.textContent = quote.replace(/\s*\/\s*/g, '\n');
      endQuote.style.display = 'block';
    } else {
      endQuote.style.display = 'none';
    }
    endBody.textContent = bodyText;
    endEnd.textContent = endText;

    setTimeout(() => endModal.classList.add('show'), 1800);
  }

  // ===== 按钮 =====
  document.getElementById('waterBtn').addEventListener('click', () => {
    if (state.dead) return;
    const w = weathers[weatherKey];
    if (w.frozen) { say('cold'); return; }
    if (w.rain || w.storm) { say('rain'); return; }
    const btn = document.getElementById('waterBtn');
    if (btn.disabled) return;
    btn.disabled = true;
    setTimeout(() => btn.disabled = false, 3000);
    state.water = Math.min(100, state.water + 22);
    potWrap.classList.remove('sway');
    void potWrap.offsetWidth;
    potWrap.classList.add('sway');
    const p = plants[current];
    const [lo, hi] = p.comfort;
    if (state.water > hi + 15) say('flooded');
    else if (state.growth >= 100) say('bloomed');
    else say('watered');
    render();
  });

  document.getElementById('seedBtn').addEventListener('click', () => { say('newSeed'); newRound(); });
  document.getElementById('endAgainBtn').addEventListener('click', () => newRound());
  document.getElementById('resetBtn').addEventListener('click', () => {
    state = freshState();
    weatherKey = pickWeightedWeather();
    soilKey = rand(Object.keys(soils));
    document.body.className = 'weather-' + weatherKey;
    buildFx();
    render();
    say('move');
  });
  document.getElementById('idleBtn').addEventListener('click', () => {
    if (state.dead) return;
    say('idle');
  });

  // ===== 主循环 =====
  function tick() {
    if (!gameStarted) return;
    if (state.dead) return;
    const p = plants[current];
    const w = weathers[weatherKey];
    const s = soils[soilKey];

    let evapo = p.evapo * w.evapo * s.evapo;
    state.water = Math.max(0, state.water - evapo);

    if (w.rain) state.water = Math.min(100, state.water + 0.8);
    if (w.storm) state.water = Math.min(100, state.water + 1.5);
    if (w.frozen) state.water = Math.max(0, state.water - 0.05);
    if (w.hurtChance && Math.random() < 0.02) state.hurt = true;

    const [lo, hi] = p.comfort;
    const inComfort = state.water >= lo && state.water <= hi;
    const m = soilMatch();
    let rate = 0;
    if (inComfort && !w.frozen && !w.pest && !state.hurt && !w.hurt && !state.wilted) {
      if (m === 'good') rate = 0.8;
      else if (m === 'bad') rate = 0.15;
      else rate = 0.4;
    }
    state.growth = Math.min(100, state.growth + rate);

    if (state.growth >= 100 && !state.wilted && !state.dead) {
      state.bloomSeconds++;
      if (state.bloomSeconds > 40) {
        state.wilted = true;
        // 枯萎后再让它在盆里放 6 秒，然后弹自然完成的文案
        setTimeout(() => {
          if (!state.dead) { state.dead = true; showEnd('wilt'); }
        }, 6000);
      }
    }

    // 压力累积
    if (state.water <= 0) state.stressDry++; else state.stressDry = 0;
    // 水过多：超过舒适上限 20 点就累积涝压（不要硬卡 100，否则蒸发一下就掉下来）
    const [_lo, _hi] = p.comfort;
    if (state.water >= _hi + 20) state.stressWet++; else state.stressWet = 0;
    if (w.frozen) state.stressFrozen++; else state.stressFrozen = 0;
    if (w.pest) state.stressPest++; else state.stressPest = 0;
    if (state.hurt || w.hurt) state.stressHurt++; else state.stressHurt = 0;

    const dryLimit = p.comfort[0] <= 30 ? 14 : 7;
    const wetLimit = p.comfort[1] >= 80 ? 14 : 8;

    // 复合死因：两个压力同时高时优先判复合
    if (state.stressDry > 5 && state.stressPest > 5) { state.dead = true; showEnd('dryPest'); }
    else if (state.stressDry > 5 && state.stressFrozen > 8) { state.dead = true; showEnd('dryFrozen'); }
    else if (state.stressWet > 5 && state.stressPest > 5) { state.dead = true; showEnd('wetPest'); }
    else if (state.stressWet > 5 && state.stressFrozen > 8) { state.dead = true; showEnd('wetFrozen'); }
    else if (state.stressHurt > 5 && state.stressDry > 5) { state.dead = true; showEnd('hurtDry'); }
    else if (state.stressHurt > 5 && state.stressWet > 5) { state.dead = true; showEnd('hurtWet'); }
    else if (state.stressHurt > 5 && state.stressFrozen > 8) { state.dead = true; showEnd('hurtFrozen'); }
    else if (state.stressHurt > 5 && state.stressPest > 5) { state.dead = true; showEnd('hurtPest'); }
    else if (state.stressDry > dryLimit) { state.dead = true; showEnd('dry'); }
    else if (state.stressWet > wetLimit) { state.dead = true; showEnd('wet'); }
    else if (state.stressFrozen > 15) { state.dead = true; showEnd('frozen'); }
    else if (state.stressPest > 15) { state.dead = true; showEnd('pest'); }
    else if (state.stressHurt > 20) { state.dead = true; showEnd('hurt'); }

    render();
  }

  // ===== 首页与 Tips 交互 =====
  const splash = document.getElementById('splash');
  const tipsModal = document.getElementById('tipsModal');

  (function(){ const st = document.querySelector('.splash-title'); if (st && gamesPlayed >= 3) st.textContent = '我的小花园。'; })();

  // 首页入场动画
  window.addEventListener('load', () => {
    const items = document.querySelectorAll('.splash-item');
    items.forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), 200 + i * 300);
    });
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    splash.classList.add('hidden');
    gameStarted = true;
    newRound();
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 1000);
  });

  document.getElementById('tipsBtn').addEventListener('click', () => {
    tipsModal.classList.add('show');
  });
  document.getElementById('gotBtn').addEventListener('click', () => {
    tipsModal.classList.remove('show');
  });
  tipsModal.addEventListener('click', (e) => {
    if (e.target === tipsModal) tipsModal.classList.remove('show');
  });
</script>
</body>
</html>
